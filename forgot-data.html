<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Проблема с входом - Газпромбанк Бизнес-Онлайн</title>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="header__main">
          <a class="header__link-logo" href="#">
            <svg width="203" height="50">
              <use
                class="header__iconlogo"
                xlink:href="images/sprite.svg#icon-header-logo"
              ></use>
            </svg>
          </a>
          <div class="wraper__info">
            <div class="header__main-info">
              <span class="header__main-title"
                >Топ-3 лучших банков для корпоративных клиентов</span
              >
              <span class="header__main-text">По версии Markswebb</span>
            </div>
            <svg class="header__main-info-logo" width="24" height="14">
              <use xlink:href="images/sprite.svg#icon-crown"></use>
            </svg>
          </div>
        </div>
      </div>
    </header>
    <main>
      <div class="container">
        <section class="forgot-data">
          <div class="forgot-data__wraper">
            <h1 class="forgot-data__title">Не можете войти?</h1>
            <a class="forgot-data__button-back">
              <svg class="forgot-data__button-icon" width="19" height="14">
                <use xlink:href="images/sprite.svg#icon-arrow"></use>
              </svg>
            </a>
            <fieldset class="forgot-data__radio-field">
              <div class="forgot-data__radio-buttons">
                <div class="custom-radio">
                  <!-- вставь в класс visually-hidden  -->
                  <input
                    class="custom-radio__field"
                    id="new-password"
                    type="radio"
                    name="action"
                    value="new"
                  />
                  <label class="custom-radio__label" for="new-password"
                    >Установить новый пароль</label
                  >
                </div>
                <div class="custom-radio">
                  <input
                    class="custom-radio__field"
                    id="restore-password"
                    type="radio"
                    name="action"
                    value="restore"
                  />
                  <label class="custom-radio__label" for="restore-password"
                    >Восстановить логин</label
                  >
                </div>
              </div>
            </fieldset>
            <button class="custom-input__btn">Продолжить</button>
          </div>
        </section>
      </div>
    </main>
    <footer class="footer">
      <div class="container">
        <div class="footer__wraper">
          <div class="fotter__menu">
            <ul class="footer__menu-wraper">
              <li class="footer__menu-inner footer__menu-inner--logo">
                <svg class="footer__menu-icon" width="16" height="16">
                  <use xlink:href="images/sprite.svg#icon-phone"></use>
                </svg>
                <a class="footer__menu-link" href="tel:88001001189"
                  >8 800 100 11 89</a
                >
              </li>
              <li class="footer__menu-inner footer__menu-inner--logo">
                <svg class="footer__menu-icon" width="16" height="14">
                  <use xlink:href="images/sprite.svg#icon-telegram"></use>
                </svg>
                <a href="#" class="footer__menu-link">Написать в Telegram</a>
              </li>
              <li class="footer__menu-inner">
                <a href="#" class="footer__menu-link"
                  >© 2024 Банк ГПБ (АО) Генеральная лицензия Банка России
                  №354</a
                >
              </li>
              <li class="footer__menu-inner">
                <a href="#" class="footer__menu-link"
                  >Политика обработки персональных данных</a
                >
              </li>
            </ul>
          </div>
          <div class="footer__theme">
            <span class="footer__theme-text">Светлая тема</span>
            <svg class="footer__theme-logo" width="16" height="16">
              <use xlink:href="images/sprite.svg#icon-theme"></use>
            </svg>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
